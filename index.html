    var h = Number(p.get('h'));
    if (data.spans.some(function (s) { return s.hours === h; })) state.hours = h;
    if (p.get('m') === 'ratio') state.mode = 'ratio';
  }
  function writeHash() {
    var p = new URLSearchParams();
    p.set('h', state.hours);
    if (state.mode === 'ratio') p.set('m', 'ratio');
    history.replaceState(null, '', '#' + p.toString());
  }

  function renderSpans() {
    var box = document.getElementById('spans');
    box.replaceChildren.apply(box, data.spans.map(function (s) {
      var b = el('button', { type: 'button', 'aria-pressed': String(s.hours === state.hours) }, spanLabel(s.hours));
      b.addEventListener('click', function () { state.hours = s.hours; render(); });
      return b;
    }));
    document.querySelectorAll('#modes button').forEach(function (b) {
      b.setAttribute('aria-pressed', String(b.getAttribute('data-mode') === state.mode));
    });
  }

  function renderCloud() {
    var span = current();
    var box = document.getElementById('cloud');
    var legend = document.getElementById('legend');
    if (!span) { box.replaceChildren(el('p', { className: 'empty', textContent: '集計結果がありません' })); legend.replaceChildren(); return; }
    var byKey = {};
    span.topics.forEach(function (t) { byKey[t.key] = t; });
    var keys = state.mode === 'ratio' ? span.byRatio : span.byAccounts;
    var topics = keys.map(function (k) { return byKey[k]; }).filter(Boolean);
    if (!topics.length) {
      box.replaceChildren(el('p', { className: 'empty', textContent: 'この期間にまとまった話題はありません' }));
    } else {
      var value = function (t) { return state.mode === 'ratio' ? Math.max(t.ratio, 0.01) : t.accounts; };
      var values = topics.map(value);
      var min = Math.min.apply(null, values);
      var max = Math.max.apply(null, values);
      var lo = narrow.matches ? 13 : 14, hi = narrow.matches ? 20 : 30;
      var size = function (v) { return max <= min ? Math.round((lo + hi) / 2) : Math.round(lo + ((Math.log(v) - Math.log(min)) / (Math.log(max) - Math.log(min))) * (hi - lo)); };
      var shown = narrow.matches && !expanded ? topics.slice(0, MOBILE_FIRST) : topics;
      box.replaceChildren.apply(box, shown.map(function (t) {
        // 押すと、その話題を X で検索する（新しいタブ）。数値はカーソルを当てると出す
        var label = t.title + '（主な分類: ' + (t.category || '不明') + '）\n' + t.accounts + ' アカウント・' + t.posts + ' 件・上昇率 ' + t.ratio + '\n最新: ' + dateText(t.latest);
        var safe = /^https:\/\/x\.com\/search\?/.test(t.search || '');
        var b = el(safe ? 'a' : 'span', { className: 'topic', title: label + (safe ? '\n押すと X で検索します' : '') },
          el('span', { className: 'dot ' + slotOf(t.category), 'aria-hidden': 'true' }), el('span', { textContent: t.title }));
        if (safe) {
          b.href = t.search;
          b.target = '_blank';
          b.rel = 'noopener noreferrer';
          b.setAttribute('aria-label', t.title + ' ' + t.accounts + ' アカウント ' + t.posts + ' 件（X で検索）');
        }
        b.style.fontSize = size(value(t)) + 'px';
        return b;
      }));
      if (shown.length < topics.length) {
        var more = el('button', { type: 'button', className: 'more' }, '残り ' + (topics.length - shown.length) + ' 件を表示');
        more.addEventListener('click', function () { expanded = true; renderCloud(); });
        box.append(more);
      }
    }
    var dots = (data.colorCategories || []).map(function (c, i) {
      return el('span', {}, el('span', { className: 'dot cat-' + (i + 1), 'aria-hidden': 'true' }), c);
    });
    legend.replaceChildren.apply(legend, dots.concat([
      el('span', {}, el('span', { className: 'dot', 'aria-hidden': 'true' }), 'その他の分類'),
      el('span', { textContent: state.mode === 'ratio'
        ? '上昇率の高い順（見出しの語の、過去 ' + data.baselineDays + ' 日平均との比）。文字の大きさも上昇率'
        : '言及したアカウント数の多い順。文字の大きさもアカウント数' }),
      el('span', { textContent: '押すとその話題を X で検索します（見出しの語すべて・話題のポスト）' }),
      el('span', { textContent: 'この期間のポスト ' + span.total + ' 件・話題 ' + span.topicCount + ' 件（上位 ' + topics.length + ' 件を表示）' }),
    ]));
  }

  function render() {
    expanded = false;
    writeHash();
    renderSpans();
    renderCloud();
  }

  document.querySelectorAll('#modes button').forEach(function (b) {
    b.addEventListener('click', function () { state.mode = b.getAttribute('data-mode'); render(); });
  });
  document.title = data.title;
  document.getElementById('title').textContent = data.title;
  document.getElementById('meta').textContent = '集計: ' + dateText(data.generatedAt) + '（X のポストを、言及したアカウント数で話題にまとめたもの）';
  readHash();
  render();
  if (narrow.addEventListener) narrow.addEventListener('change', function () { renderCloud(); });

  // 開いたままでも新しい集計が出るよう、30 分ごとに読み直す（期間・並べ方は URL の # に残っているので保たれる）。
  // 裏のタブにあるあいだは読み直さず、表に戻ったときに読み直す
  var RELOAD_MS = 30 * 60 * 1000;
  var due = false;
  function reload() { location.reload(); }
  setTimeout(function () {
    if (document.hidden) due = true;
    else reload();
  }, RELOAD_MS);
  document.addEventListener('visibilitychange', function () { if (due && !document.hidden) reload(); });
})();
</script>
</body>
</html>
